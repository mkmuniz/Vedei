version: "2"

linters:
  enable:
    - gosec          # nadzor is a security tool; it passes a security linter
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - errorlint
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # Test files legitimately use weak randomness to generate cases.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
